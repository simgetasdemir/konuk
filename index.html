<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Konuk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: konuk odaları solda, İznik çinisi gibi bulmaca tahtası ortada, konukevi defteri sağda; dar ekranda üst üste. */
:root{
  --bg:#edf2f6; --surface:#ffffff; --surface-2:#f6f9fb; --ink:#14243a; --muted:#5a6b7e; --line:#d3dde6;
  --accent:#1f4fa3; --nar:#c23a2b; --board:#dbe5ee; --board-line:#c7d4e0;
  --t-yemek:#c8402c; --t-cay:#c4840f; --t-yastik:#2a56b0; --t-sabun:#13918e; --t-nota:#3d8848;
  --good:#2e8a4b; --warn:#c4840f; --bad:#c23a2b; --shade:rgba(20,36,58,.45);
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Nunito Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1420; --surface:#142133; --surface-2:#18283c; --ink:#e6edf5; --muted:#93a4b7; --line:#24364b;
  --accent:#86aaf2; --nar:#ef7764; --board:#101c2b; --board-line:#1d2e43;
  --t-yemek:#d65340; --t-cay:#d4951f; --t-yastik:#3e6cc8; --t-sabun:#1ea6a2; --t-nota:#4f9c5a;
  --good:#5cbf7a; --warn:#e0a83a; --bad:#ef7764; --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1420; --surface:#142133; --surface-2:#18283c; --ink:#e6edf5; --muted:#93a4b7; --line:#24364b;
  --accent:#86aaf2; --nar:#ef7764; --board:#101c2b; --board-line:#1d2e43;
  --t-yemek:#d65340; --t-cay:#d4951f; --t-yastik:#3e6cc8; --t-sabun:#1ea6a2; --t-nota:#4f9c5a;
  --good:#5cbf7a; --warn:#e0a83a; --bad:#ef7764; --shade:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.guest:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:40px;letter-spacing:-.02em;margin:0;line-height:1}
.brand h1 span{color:var(--nar)}
.brand p{margin:0;color:var(--muted);font-weight:600}
.stats{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px;display:flex;flex-direction:column;min-width:74px}
.stat small{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.stat b{font-family:var(--f-display);font-size:19px;font-variant-numeric:tabular-nums}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:700}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr) 250px;gap:20px;align-items:start}
.guests{display:flex;flex-direction:column;gap:10px;min-width:0}
.guest{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px;width:100%;position:relative;transition:border-color .15s, box-shadow .15s}
.guest.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.guest.empty{border-style:dashed;color:var(--muted);align-items:center;justify-content:center;min-height:80px;cursor:default;background:transparent}
.g-head{display:flex;gap:10px;align-items:center}
.ava{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:#fff;font-size:18px;flex:none}
.g-name{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.1}
.g-sub{font-size:12.5px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.chip.mood-good{color:var(--good)} .chip.mood-mid{color:var(--warn)} .chip.mood-bad{color:var(--bad)}
.needs{display:grid;grid-template-columns:1fr;gap:4px}
.need{display:grid;grid-template-columns:18px 64px 1fr 28px;gap:6px;align-items:center;font-size:12px}
.need svg{width:16px;height:16px}
.bar{height:7px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .35s}
.need.low span{color:var(--bad);font-weight:700}
.need em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.gonul{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700}
.gonul .bar{flex:1;height:9px}
.gonul .bar i{background:var(--nar)}
.wish{font-size:12.5px;background:var(--surface-2);border-radius:8px;padding:6px 8px;display:flex;gap:6px;align-items:center}
.wish.done{color:var(--good);font-weight:700}
.wish svg{width:15px;height:15px;flex:none}
.rel{font-size:12px;color:var(--muted)}
.boardwrap{display:flex;flex-direction:column;gap:10px;align-items:center;min-width:0}
.board{position:relative;width:100%;max-width:560px;aspect-ratio:1;border-radius:18px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  background:
   radial-gradient(circle at 50% 50%, transparent 0 38%, var(--board-line) 39% 41%, transparent 42%) 0 0/ calc(100%/7) calc(100%/7),
   var(--board);border:1px solid var(--line)}
.tile{position:absolute;left:0;top:0;width:calc(100%/7);height:calc(100%/7);padding:4px;transition:transform .22s cubic-bezier(.3,.7,.4,1)}
.face{width:100%;height:100%;border-radius:24%;display:grid;place-items:center;color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18), 0 1px 2px rgba(0,0,0,.15);transition:transform .2s, opacity .2s}
.face svg{width:60%;height:60%;position:relative}
.face{position:relative;overflow:hidden}
.face::before{content:"";position:absolute;left:12%;right:12%;top:6%;height:40%;border-radius:50%/60% 60% 40% 40%;background:linear-gradient(rgba(255,255,255,.42),rgba(255,255,255,0));pointer-events:none}
.spark{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;pointer-events:none;z-index:5;animation:spark .55s ease-out forwards;box-shadow:0 0 0 2px rgba(255,255,255,.5)}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.fly{position:fixed;left:0;top:0;z-index:40;pointer-events:none;width:36px;height:36px;transition:transform .6s cubic-bezier(.5,0,.5,1),opacity .6s ease-in}
.fly .face{width:100%;height:100%}
.combo{position:absolute;left:50%;top:45%;font-family:var(--f-display);font-weight:800;font-size:44px;color:#fff;white-space:nowrap;text-shadow:0 3px 0 rgba(0,0,0,.3),0 0 20px rgba(0,0,0,.3);z-index:6;pointer-events:none;animation:combo .9s ease-out forwards}
@keyframes combo{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15);opacity:1}100%{transform:translate(-50%,-110%) scale(1);opacity:0}}
.tile.sel .face{transform:scale(1.1);box-shadow:0 0 0 3px var(--ink), inset 0 -4px 0 rgba(0,0,0,.18)}
.tile.pop .face{transform:scale(.1) rotate(25deg);opacity:0}
.tile.hint .face{animation:wig .6s ease-in-out 2}
@keyframes wig{50%{transform:scale(1.12)}}
.hint-line{color:var(--muted);font-size:13.5px;text-align:center;min-height:2.8em;margin:0;max-width:560px}
.hint-line b{color:var(--ink)}
.side{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.side h2{font-family:var(--f-display);font-size:18px;margin:0}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:520px;overflow:auto;font-size:13px}
.log li{border-bottom:1px solid var(--line);padding-bottom:6px}
.log li small{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:6px}
.float{position:fixed;pointer-events:none;font-weight:800;font-size:13px;z-index:30;animation:up 1.1s ease-out forwards;font-family:var(--f-display);text-shadow:0 1px 0 var(--surface)}
@keyframes up{from{transform:translateY(0);opacity:1}to{transform:translateY(-38px);opacity:0}}
.modal{position:fixed;inset:0;background:var(--shade);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:18px;max-width:620px;width:100%;max-height:100%;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.sheet h2{font-family:var(--f-display);font-size:28px;margin:0;text-wrap:balance}
.sheet h3{font-family:var(--f-display);font-size:16px;margin:0;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sheet ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.review{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.review .stars{color:var(--warn);letter-spacing:2px}
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.item{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.item b{font-family:var(--f-display)}
.item p{margin:0;font-size:13px;color:var(--muted)}
.item .btn{align-self:flex-start;padding:5px 12px}
.item.owned{opacity:.6}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px}
.legend div{display:flex;align-items:center;gap:8px;font-size:13.5px}
.legend .face{width:30px;height:30px;flex:none}
.win{background:var(--nar);color:var(--surface);border-radius:12px;padding:10px 14px;font-weight:700}
.lobby{width:100%;max-width:560px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--surface);position:relative}
.lobby svg{display:block;width:100%;height:auto}
.lobby-cap{position:absolute;left:10px;top:8px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.82);color:#14243a;padding:2px 8px;border-radius:99px}
.guy{transition:transform .6s ease}
.cats{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cat{pointer-events:auto;cursor:pointer}
.cat .walk{animation:walk var(--d) ease-in-out infinite alternate}
.cat .flip{animation:flip var(--d) steps(1) infinite}
.cat .tail{transform-origin:12px -8px;animation:tail 1.6s ease-in-out infinite alternate}
.cat.sleepy .walk,.cat.sleepy .flip{animation-play-state:paused}
@keyframes walk{0%,12%{transform:translateX(0)}88%,100%{transform:translateX(var(--w))}}
@keyframes flip{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}}
@keyframes tail{to{transform:rotate(-28deg)}}
.cat-heart{animation:up 1s ease-out forwards}
.sheet.wide{max-width:1000px}
.plan-wrap{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:14px;align-items:start}
.plan{position:relative;width:100%;aspect-ratio:16/10;border-radius:10px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;border:3px solid #6b4a32;background:#6b4a32}
.zone{position:absolute;border:3px solid #6b4a32;box-sizing:border-box}
.zone.lobi{background:repeating-linear-gradient(90deg,#c8955f 0 calc(100%/8 - 1px),#b98550 calc(100%/8 - 1px) calc(100%/8))}
.zone.oda{background:#e9dcc4}
.zone.oda:nth-of-type(3){background:#dfe3cf}.zone.oda:nth-of-type(4){background:#e6d6d9}.zone.oda:nth-of-type(5){background:#d6dde6}
.zone.locked{background:repeating-linear-gradient(45deg,#8a7a6a 0 8px,#9a8a78 8px 16px)}
.zone .zl{position:absolute;left:4px;bottom:3px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:rgba(40,26,14,.6)}
.zone.locked .zl{color:#f4f1ea}
.gridlines{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(0,0,0,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.07) 1px,transparent 1px);background-size:calc(100%/16) calc(100%/10)}
.fi{position:absolute;padding:2px;cursor:pointer}
.fi svg{width:100%;height:100%;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.fi.sel{outline:3px solid var(--accent);outline-offset:-1px;border-radius:4px}
.fi.fixed{cursor:default}
.ghost{position:absolute;pointer-events:none;opacity:.75;border-radius:4px}
.ghost.ok{outline:3px solid #2e8a4b;background:rgba(46,138,75,.18)}
.ghost.bad{outline:3px solid #c23a2b;background:rgba(194,58,43,.18)}
.pg{position:absolute;width:calc(100%/16*.9);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:11px;border:2px solid #fff;pointer-events:none;transform:translate(-50%,-50%);font-family:var(--f-display)}
.cat-list{display:flex;flex-direction:column;gap:6px;max-height:440px;overflow:auto}
.ci{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.ci.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.ci:disabled{opacity:.5;cursor:not-allowed}
.ci svg{width:36px;height:36px}
.ci b{display:block;font-size:13px}.ci small{color:var(--muted);font-size:11.5px}
.ci em{font-style:normal;font-weight:800;font-size:13px}
.fx-icons{display:inline-flex;gap:2px;vertical-align:middle}.fx-icons svg{width:13px;height:13px}
.plan-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-height:38px}
.plan-bar .btn{padding:6px 12px}
.rooms-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;font-size:12.5px}
.rooms-sum div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px}
.rooms-sum b{display:block;margin-bottom:2px}
@media (max-width:760px){.plan-wrap{grid-template-columns:minmax(0,1fr)}.cat-list{flex-direction:row;overflow-x:auto;max-height:none}.ci{flex:0 0 210px}}
.radio-box{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:45;width:300px;max-width:calc(100% - 32px);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.radio-head{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;font-size:13px}
.radio-head a{color:var(--accent);font-weight:700}
.radio-box iframe{display:block;width:100%;aspect-ratio:16/9;border:0}
.nick-in{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);width:100%;max-width:320px}
.err{color:var(--bad);font-weight:700;margin:0;font-size:13px}
.room-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.room-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px}
.room-btn:hover,.room-btn.on{border-color:var(--accent)}
.room-btn b{font-family:var(--f-display);font-size:16px}.room-btn small{color:var(--muted)}
.chat-panel{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:44;width:340px;max-width:calc(100% - 32px);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.22);display:flex;flex-direction:column;overflow:hidden}
.cp-head{display:flex;gap:6px;align-items:center;padding:8px;border-bottom:1px solid var(--line)}
.cp-head .btn{padding:5px 10px;font-size:12.5px}
.cp-title{flex:1;min-width:0;text-align:left;background:none;border:0;font-weight:800;font-family:var(--f-display);font-size:14px;padding:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-panel.closed .cp-body{display:none}
.cp-body{display:flex;flex-direction:column;gap:6px;padding:8px}
.cp-people{display:flex;flex-wrap:wrap;gap:4px;max-height:66px;overflow:auto}
.cp-person{font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:2px 8px}
.cp-person.me{border-color:var(--accent)}
.cp-person small{font-weight:600;color:var(--muted)}
.cp-msgs{list-style:none;margin:0;padding:0;height:min(260px,38vh);overflow:auto;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.cp-msgs li{overflow-wrap:anywhere}
.cp-msgs li small{color:var(--muted);margin-right:6px;font-variant-numeric:tabular-nums}
.cp-msgs li.sys{color:var(--muted);font-style:italic;font-size:12.5px}
.cp-status{margin:0;font-size:12.5px;color:var(--bad);font-weight:700}
.cp-form{display:flex;gap:6px}
.cp-form input{flex:1;min-width:0;font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
.cp-form .btn{padding:6px 12px}
.decor-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);position:relative}
.sw.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.sw span{position:absolute;left:0;right:0;bottom:-20px;font-size:11px;text-align:center;color:var(--muted)}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
@media (max-width:1060px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .guests{flex-direction:row;overflow-x:auto;padding:3px 3px 8px;order:0}
  .guest{flex:0 0 260px}
  .boardwrap{order:1}.side{order:2}
  .log{max-height:260px}
}
@media (max-width:520px){.brand h1{font-size:32px}.stat{min-width:62px;padding:5px 9px}.stat b{font-size:16px}.tile{padding:2px}}
.guest.got{animation:got .45s ease-out}
@keyframes got{40%{transform:scale(1.03)}}
@media (prefers-reduced-motion:reduce){.cat .walk,.cat .flip,.cat .tail{animation:none}.tile,.face,.bar i{transition:none}.float,.tile.hint .face{animation:none}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand"><h1>Kon<span>u</span>k</h1><p>Simge Hotel, Ayvalık</p></div>
    <div class="stats">
      <div class="stat"><small>Gün</small><b id="s-day">1</b></div>
      <div class="stat"><small>Saat</small><b id="s-clock">08:00</b></div>
      <div class="stat"><small>Hamle</small><b id="s-moves">18</b></div>
      <div class="stat"><small>Kasa</small><b id="s-lira">30 ₺</b></div>
      <div class="stat"><small>İtibar</small><b id="s-rep">—</b></div>
      <button class="btn" id="b-build" type="button">Kat planı</button>
      <button class="btn" id="b-decor" type="button">Dekorasyon</button>
      <button class="btn" id="b-sound" type="button" aria-pressed="false">Müzik: kapalı</button>
      <button class="btn" id="b-radio" type="button" aria-pressed="false">Radyo</button>
      <button class="btn" id="b-chat" type="button">Sohbet odaları</button>
      <button class="btn" id="b-help" type="button">Nasıl oynanır</button>
      <button class="btn" id="b-new" type="button">Yeni oyun</button>
    </div>
  </header>
  <main class="layout">

      <div class="lobby" id="lobby" aria-label="Otel lobisi"></div>

  </main>
</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(function(){
const N=7, SAVE_KEY='konuk-save-v1';
const ICON={
 yemek:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.5 11h19a9.5 9 0 0 1-19 0z"/><rect x="8" y="19.6" width="8" height="2" rx="1"/><path d="M8.5 3.5c-1 1.6 1 2.4 0 4.5M12.5 3c-1 1.6 1 2.4 0 4.5M16.5 3.5c-1 1.6 1 2.4 0 4.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>',
 cay:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4h10c0 3.2-2.2 4.3-2.2 7.5S17 15.6 17 19H7c0-3.4 2.2-4.3 2.2-7.5S7 7.2 7 4z"/><rect x="3.5" y="19.8" width="17" height="2.2" rx="1.1"/></svg>',
 yastik:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.5 6.5c3.5-2.2 13.5-2.2 17 0 1.3 3.6 1.3 7.4 0 11-3.5 2.2-13.5 2.2-17 0-1.3-3.6-1.3-7.4 0-11z"/><circle cx="2.6" cy="5.6" r="1.4"/><circle cx="21.4" cy="5.6" r="1.4"/><circle cx="2.6" cy="18.4" r="1.4"/><circle cx="21.4" cy="18.4" r="1.4"/></svg>',
 sabun:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="14.5" r="6"/><circle cx="17" cy="7.5" r="3.6"/><circle cx="18.6" cy="16.6" r="2.2"/></svg>',
 nota:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 17.5V5.2l10.5-2.2v12.5" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linejoin="round"/><ellipse cx="6.3" cy="17.6" rx="3.3" ry="2.6"/><ellipse cx="16.8" cy="15.6" rx="3.3" ry="2.6"/></svg>'
};
const TYPES={
 yemek:{label:'Yemek',need:'Tokluk'}, cay:{label:'Çay',need:'Sohbet'}, yastik:{label:'Yastık',need:'Dinlenme'},
 sabun:{label:'Sabun',need:'Temizlik'}, nota:{label:'Müzik',need:'Keyif'}
};
const TK=Object.keys(TYPES);
const TRAITS={
 obur:{label:'Obur',fav:'yemek',desc:'çabuk acıkır, yemeğe bayılır'},
 geveze:{label:'Geveze',fav:'cay',desc:'lafa doyamaz, çaysız duramaz'},
 uykucu:{label:'Uykucu',fav:'yastik',desc:'çabuk yorulur, yastığı sever'},
 titiz:{label:'Titiz',fav:'sabun',desc:'tozdan hoşlanmaz'},
 neseli:{label:'Neşeli',fav:'nota',desc:'müziksiz sıkılır'}
};
const COMPAT={'geveze|neseli':1,'geveze|obur':1,'titiz|uykucu':1,'neseli|obur':1,'obur|titiz':-1,'neseli|uykucu':-1,'geveze|uykucu':-1};
const NAMES=['Ayşe','Kemal','Defne','Murat','Elif','Hasan','Zeynep','Barış','Nilüfer','Cem','Sevgi','Orhan','Leyla','Emre','Gül','Tarık','Melek','Rıza','Ece','Yusuf','Nazlı','Selim','Feride','Kaan'];
const ORIGINS=['İzmirli emekli öğretmen','Karslı peynirci','Berlin’den gelen gurbetçi','Trabzonlu fotoğrafçı','Ankaralı mimar','Mardinli bakırcı','Bodrumlu balıkçı','Eskişehirli öğrenci','İstanbullu romancı','Antakyalı aşçı','Konyalı halıcı','Rizeli çay üreticisi'];
const AVA=['#1f4fa3','#c23a2b','#13918e','#7a4fa8','#c4840f','#3d8848','#a84f6e'];
const SHOP=[
 {id:'semaver',name:'Bakır semaver',cost:40,desc:'Çay taşları %50 daha fazla sohbet verir.'},
 {id:'gramofon',name:'Gramofon',cost:50,desc:'Müzik salondaki herkese tam etki eder.'},
 {id:'bahce',name:'Asma altı bahçe',cost:60,desc:'Her gün 4 hamle daha.'},
 {id:'oda',name:'Çatı katı odası',cost:90,desc:'Dördüncü konuk odası açılır.'}
];

const $=id=>document.getElementById(id);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const wait=ms=>new Promise(r=>setTimeout(r,ms));

let S, cells=[], uid=0, busy=false, selTile=null, drag=null;
const els=new Map();

function newGuest(){
  const used=new Set(S.guests.map(g=>g.name));
  const name=rnd(NAMES.filter(n=>!used.has(n)));
  const trait=rnd(Object.keys(TRAITS));
  const needs={}; TK.forEach(t=>needs[t]=ri(40,75));
  const taken=new Set(S.guests.map(x=>x.room));let room=1;while(taken.has(room))room++;
  const g={id:S.nextId++,room,name,trait,origin:rnd(ORIGINS.filter(o=>!S.guests.some(x=>x.origin===o))),needs,gonul:30,nights:ri(2,3),color:rnd(AVA),wish:null};
  g.wish=makeWish(g); return g;
}
function makeWish(g){
  const t=Math.random()<.5?TRAITS[g.trait].fav:rnd(TK);
  return {t,target:ri(9,15),got:0,done:false};
}
function freshState(){
  S={day:1,move:0,lira:30,reviews:[],guests:[],sel:0,rooms:3,up:{},rel:{},log:[],nextId:1,won:false,grid:null,seenHelp:false,decor:{},wall:'deniz',petted:{},furn:null,fid:1};
  S.guests.push(newGuest()); S.guests.push(newGuest());
  addLog('Simge Hotel kapılarını açtı. İlk konuklar geldi: '+S.guests.map(g=>g.name).join(' ve ')+'.');
  genGrid();
}
const movesPerDay=()=>18+(S.up.bahce?4:0);
const clock=()=>{const m=8*60+S.move*Math.round(13*60/movesPerDay());return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');};
const rep=()=>{const r=S.reviews.slice(-10);return r.length?r.reduce((a,b)=>a+b.stars,0)/r.length:0;};
function mood(g){return TK.reduce((a,t)=>a+g.needs[t],0)/TK.length;}
function relKey(a,b){return [a.id,b.id].sort((x,y)=>x-y).join('-');}
function relOf(g){
  const out={fr:[],rv:[]};
  S.guests.forEach(o=>{if(o===g)return;const v=S.rel[relKey(g,o)]||0;if(v>=30)out.fr.push(o.name);else if(v<=-30)out.rv.push(o.name);});
  return out;
}
function addLog(text){S.log.unshift({t:'G'+S.day+' '+clock(),text});S.log=S.log.slice(0,40);}

/* ---------- tahta ---------- */
function newTile(t){return {t,id:++uid};}
function makesMatch(r,c,t){
  return (c>=2&&cells[r][c-1].t===t&&cells[r][c-2].t===t)||(r>=2&&cells[r-1][c].t===t&&cells[r-2][c].t===t);
}
function genGrid(){
  do{cells=[];for(let r=0;r<N;r++){cells[r]=[];for(let c=0;c<N;c++){let t;do{t=rnd(TK);}while(makesMatch(r,c,t));cells[r][c]=newTile(t);}}}
  while(!findMove());
}
function findGroups(){
  const gs=[];
  for(let r=0;r<N;r++){let c=0;while(c<N){let e=c;while(e+1<N&&cells[r][e+1].t===cells[r][c].t)e++;if(e-c>=2){const cs=[];for(let k=c;k<=e;k++)cs.push([r,k]);gs.push({t:cells[r][c].t,cells:cs});}c=e+1;}}
  for(let c=0;c<N;c++){let r=0;while(r<N){let e=r;while(e+1<N&&cells[e+1][c].t===cells[r][c].t)e++;if(e-r>=2){const cs=[];for(let k=r;k<=e;k++)cs.push([k,c]);gs.push({t:cells[r][c].t,cells:cs});}r=e+1;}}
  return gs;
}
function swap(a,b){const x=cells[a[0]][a[1]];cells[a[0]][a[1]]=cells[b[0]][b[1]];cells[b[0]][b[1]]=x;}
function findMove(){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(const [dr,dc] of [[0,1],[1,0]]){
    const r2=r+dr,c2=c+dc;if(r2>=N||c2>=N)continue;
    swap([r,c],[r2,c2]);const ok=findGroups().length>0;swap([r,c],[r2,c2]);
    if(ok)return [[r,c],[r2,c2]];
  }
  return null;
}
function renderBoard(){
  const board=$('board'),live=new Set();
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const cell=cells[r][c];if(!cell)continue;live.add(cell.id);
    let el=els.get(cell.id);
    if(!el){
      el=document.createElement('div');el.className='tile';
      el.innerHTML='<div class="face" style="background:var(--t-'+cell.t+')">'+ICON[cell.t]+'</div>';
      el.setAttribute('aria-label',TYPES[cell.t].label);
      el.style.transform='translate('+c*100+'%,'+(cell.from??r)*100+'%)';
      board.appendChild(el);els.set(cell.id,el);void el.offsetWidth;delete cell.from;
    }
    el.dataset.r=r;el.dataset.c=c;
    el.style.transform='translate('+c*100+'%,'+r*100+'%)';
    el.classList.toggle('sel',!!selTile&&selTile[0]===r&&selTile[1]===c);
  }
  for(const [id,el] of els){if(!live.has(id)){el.remove();els.delete(id);}}
}
function gravity(){
  for(let c=0;c<N;c++){
    const col=[];for(let r=N-1;r>=0;r--)if(cells[r][c])col.push(cells[r][c]);
    const missing=N-col.length;
    for(let r=N-1,i=0;r>=0;r--,i++){
      if(i<col.length)cells[r][c]=col[i];
      else{const t=newTile(rnd(TK));t.from=r-missing;cells[r][c]=t;}
    }
  }
}

async function trySwap(a,b){
  if(busy)return;
  if(Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])!==1)return;
  busy=true;selTile=null;
  swap(a,b);renderBoard();await wait(200);
  if(!findGroups().length){
    swap(a,b);renderBoard();await wait(200);
    setHint('Bu takas eşleşme yapmıyor. Aynı türden üç taşı yan yana ya da alt alta getir.');
    busy=false;return;
  }
  await cascade();
  endMove();
  busy=false;
}
async function cascade(){
  let combo=0;
  while(true){
    const gs=findGroups();if(!gs.length)break;
    const set=new Map();let maxLen=0;
    gs.forEach(g=>{maxLen=Math.max(maxLen,g.cells.length);g.cells.forEach(([r,c])=>set.set(r+','+c,[r,c]));});
    const tally={};
    for(const [r,c] of set.values()){const t=cells[r][c].t;tally[t]=(tally[t]||0)+1;}
    for(const t in tally)deliver(t,tally[t],combo);
    Sound.pluck(combo,Object.keys(tally));
    S.todayTiles=(S.todayTiles||0)+set.size;
    bus('match',{len:maxLen,combo,count:set.size});
    const g=S.guests[S.sel];
    if(g&&maxLen>=4){const b=maxLen>=5?8:4;g.gonul=clamp(g.gonul+b,0,100);floatAt(g.id,'+'+b+' gönül','var(--nar)');}
    if(combo>=1)setHint('<b>Zincirleme '+(combo+1)+'x!</b> Değerler artıyor.');
    for(const [r,c] of set.values())els.get(cells[r][c].id)?.classList.add('pop');
    fx(set,combo);
    renderGuests();
    await wait(230);
    for(const [r,c] of set.values())cells[r][c]=null;
    gravity();renderBoard();
    await wait(300);
    combo++;
  }
}
function deliver(t,n,combo){
  if(!S.guests.length)return;
  let base=6*n*(1+.25*combo);
  if(t==='cay'&&S.up.semaver)base*=1.5;
  if(t==='nota'){
    S.guests.forEach((x,i)=>give(x,t,base*(i===S.sel||S.up.gramofon?1:.5),n));
  }else give(S.guests[S.sel],t,base,n);
}
function give(g,t,v,n){
  if(!g)return;
  if(TRAITS[g.trait].fav===t)v*=1.4;
  const before=g.needs[t];g.needs[t]=clamp(before+v,0,100);
  const gain=Math.round(g.needs[t]-before);
  floatAt(g.id,gain>0?'+'+gain+' '+TYPES[t].need:TYPES[t].need+' dolu','var(--t-'+t+')');
  const w=g.wish;
  if(w&&!w.done&&w.t===t){
    w.got+=n;
    if(w.got>=w.target){w.done=true;g.gonul=clamp(g.gonul+15,0,100);addLog(g.name+' dileği gerçekleşti, çok memnun kaldı.');floatAt(g.id,'Dilek tamam! +15 gönül','var(--nar)');}
  }
}
function endMove(){
  S.move++;
  bus('move',stats());
  S.guests.forEach(g=>{
    const fav=TRAITS[g.trait].fav,r=relOf(g);
    TK.forEach(t=>{
      let d=1.1;if(t===fav)d=2.6;
      const dec=DECOR.find(x=>x.need===t);if(dec&&S.decor[dec.id])d*=.8;
      d*=furnFactor(g.room,t);
      if(t==='cay'&&r.fr.length)d*=.5;
      if(t==='nota'&&r.rv.length)d*=1.6;
      g.needs[t]=clamp(g.needs[t]-d,0,100);
    });
    const m=mood(g),zero=TK.some(t=>g.needs[t]<=0);
    let dg=m>=70?2:m>=50?1:m<30?-2:0;if(zero)dg-=3;
    g.gonul=clamp(g.gonul+dg,0,100);
  });
  const angry=S.guests.filter(g=>g.gonul<=0);
  angry.forEach(g=>{
    const rv={name:g.name,trait:g.trait,stars:1,day:S.day,text:'Kimse benimle ilgilenmedi. Gece yarısı bavulumu topladım.'};
    S.reviews.push(rv);addLog(g.name+' küplere bindi ve oteli erkenden terk etti. (1 yıldız)');
  });
  if(angry.length){S.guests=S.guests.filter(g=>g.gonul>0);S.sel=clamp(S.sel,0,Math.max(0,S.guests.length-1));}
  if(!findMove()){addLog('Tahtada hamle kalmadı, taşlar yeniden dizildi.');genGrid();els.forEach(e=>e.remove());els.clear();}
  renderAll();save();
  if(S.move>=movesPerDay())setTimeout(night,450);
}

const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
function fx(set,combo){
  if(REDUCE)return;
  const board=$('board'),g=S.guests[S.sel];
  const card=g&&document.querySelector('.guest[data-id="'+g.id+'"]');
  const flown=new Set();
  for(const [r,c] of set.values()){
    const t=cells[r][c].t;
    for(let k=0;k<5;k++){
      const sp=document.createElement('div');sp.className='spark';
      const a=Math.random()*Math.PI*2,d=26+Math.random()*30;
      sp.style.left=((c+.5)/N*100)+'%';sp.style.top=((r+.5)/N*100)+'%';
      sp.style.background='var(--t-'+t+')';sp.style.setProperty('--dx',Math.cos(a)*d+'px');sp.style.setProperty('--dy',Math.sin(a)*d+'px');
      board.appendChild(sp);setTimeout(()=>sp.remove(),600);
    }
    if(card&&!flown.has(t)){
      flown.add(t);
      const src=els.get(cells[r][c].id)?.getBoundingClientRect(),dst=card.getBoundingClientRect();
      if(!src||!dst.width)continue;
      const f=document.createElement('div');f.className='fly';
      f.innerHTML='<div class="face" style="background:var(--t-'+t+')">'+ICON[t]+'</div>';
      const x0=src.left+src.width/2-18,y0=src.top+src.height/2-18,x1=dst.left+40,y1=dst.top+20;
      f.style.transform='translate('+x0+'px,'+y0+'px)';document.body.appendChild(f);
      void f.offsetWidth;
      f.style.transform='translate('+x1+'px,'+y1+'px) scale(.55)';f.style.opacity='.3';
      setTimeout(()=>{f.remove();card.classList.remove('got');void card.offsetWidth;card.classList.add('got');},620);
    }
  }
  if(combo>=1){const cb=document.createElement('div');cb.className='combo';cb.textContent=(combo+1)+'x Zincir!';board.appendChild(cb);setTimeout(()=>cb.remove(),950);}
}
let idleTimer=null;
function armIdle(){
  clearTimeout(idleTimer);
  idleTimer=setTimeout(()=>{
    if(!busy&&$('modal').hidden){
      const m=findMove();
      if(m)m.forEach(([r,c])=>{const el=els.get(cells[r][c].id);if(!el)return;el.classList.remove('hint');void el.offsetWidth;el.classList.add('hint');});
    }
    armIdle();
  },9000);
}

/* ---------- dekorasyon ---------- */
const DECOR=[
 {id:'kilim',name:'Yün kilim',cost:30,need:'yastik',desc:'Lobiye el dokuması kilim. Dinlenme %20 daha yavaş azalır.'},
 {id:'sardunya',name:'Sardunya saksıları',cost:25,need:'sabun',desc:'Pencere önünde kırmızı sardunyalar. Temizlik %20 daha yavaş azalır.'},
 {id:'sofra',name:'Bakır sini sofra',cost:35,need:'yemek',desc:'Yer sofrası ve minderler. Tokluk %20 daha yavaş azalır.'},
 {id:'cini',name:'Duvar çinileri',cost:45,need:'cay',desc:'Duvar boyunca bir sıra çini. Sohbet %20 daha yavaş azalır.'},
 {id:'avize',name:'Pirinç avize',cost:55,need:'nota',desc:'Tavandan sarkan sıcak ışıklı avize. Keyif %20 daha yavaş azalır.'},
 {id:'ayna',name:'Nazarlı ayna',cost:40,need:null,desc:'Girişe nazar boncuklu yuvarlak ayna. Her gece konukların gönlü +5.'}
];
const WALLS={deniz:['Deniz','#bcd9de'],lavanta:['Lavanta','#d3cbe8'],nar:['Nar','#efc7bf'],kirec:['Kireç','#ece7dc'],zeytin:['Zeytin','#cfd6b4']};
function renderLobby(){

     '<pattern id="wood" width="60" height="14" patternUnits="userSpaceOnUse"><rect width="60" height="14" fill="#b07a4c"/><rect y="13" width="60" height="1" fill="#8d5f38"/><rect x="30" width="1" height="14" fill="#8d5f38"/></pattern></defs>';
  g+='<rect width="600" height="150" fill="'+wall+'"/><rect y="150" width="600" height="50" fill="url(#wood)"/><rect y="146" width="600" height="5" fill="#f4f1ea" opacity=".8"/>';
  // pencere ve deniz
  g+='<rect x="34" y="22" width="140" height="92" rx="6" fill="#f4f1ea"/><rect x="40" y="28" width="128" height="80" fill="url(#sky)"/>'+
     '<circle cx="140" cy="50" r="11" fill="#ffd36b"/><rect x="40" y="78" width="128" height="30" fill="#2f86b5"/><path d="M40 84 q16 -5 32 0 t32 0 t32 0 t32 0" stroke="#bfe3f3" stroke-width="2" fill="none"/>'+
     '<path d="M70 78 l10 -16 l8 16 z" fill="#f4f1ea"/><rect x="102" y="28" width="4" height="80" fill="#f4f1ea"/>';
  if(U.bahce)g+='<path d="M30 22 q35 -14 74 -2 q38 -12 74 2" stroke="#4d7a2e" stroke-width="4" fill="none"/>'+[44,70,98,128,156].map((x,i)=>'<circle cx="'+x+'" cy="'+(24+(i%2)*4)+'" r="5" fill="#5a8f35"/><circle cx="'+(x+6)+'" cy="'+(31+(i%2)*3)+'" r="3.4" fill="#6b3d7a"/><circle cx="'+(x+2)+'" cy="'+(35+(i%2)*3)+'" r="3.4" fill="#7a4789"/>').join('');
  if(D.sardunya)[52,90,128].forEach(x=>{g+='<path d="M'+(x-9)+' 112 h18 l-3 14 h-12 z" fill="#c0643c"/>'+[[-5,-4],[0,-9],[5,-4],[2,-2]].map(([dx,dy])=>'<circle cx="'+(x+dx)+'" cy="'+(110+dy)+'" r="4" fill="#d6323a"/>').join('')+'<circle cx="'+(x-7)+'" cy="111" r="3" fill="#4d7a2e"/><circle cx="'+(x+7)+'" cy="111" r="3" fill="#4d7a2e"/>';});

function defaultFurn(){
  S.furn=[{uid:S.fid++,id:'resepsiyon',x:5,y:0,rot:0},{uid:S.fid++,id:'tekyatak',x:8,y:0,rot:0},{uid:S.fid++,id:'tekyatak',x:12,y:0,rot:0},{uid:S.fid++,id:'tekyatak',x:8,y:5,rot:0},{uid:S.fid++,id:'tekyatak',x:12,y:5,rot:0}];
}
const fdim=(f)=>{const d=FURN[f.id];return f.rot?[d.h,d.w]:[d.w,d.h];};
function zoneAt(x,y){return ZONES.find(z=>x>=z.x&&x<z.x+z.w&&y>=z.y&&y<z.y+z.h);}
const zoneOpen=z=>!z.room||z.room<=S.rooms;
function canPlace(id,x,y,rot,ignore){
  const d=FURN[id],[w,h]=rot?[d.h,d.w]:[d.w,d.h];
  if(x<0||y<0||x+w>PW||y+h>PH)return false;
  const z=zoneAt(x,y);if(!z||!zoneOpen(z))return false;
  if(d.zone==='lobi'&&z.id!=='lobi')return false;
  if(d.zone==='oda'&&!z.room)return false;
  for(let i=0;i<w;i++)for(let j=0;j<h;j++)if(zoneAt(x+i,y+j)!==z)return false;
  for(const f of S.furn){if(f.uid===ignore)continue;const [fw,fh]=fdim(f);if(x<f.x+fw&&x+w>f.x&&y<f.y+fh&&y+h>f.y)return false;}
  return true;
}
function zoneScore(zid){
  const out={};TK.forEach(t=>out[t]=0);
  S.furn.forEach(f=>{const z=zoneAt(f.x,f.y);if(z&&z.id===zid)for(const t in FURN[f.id].fx)out[t]+=FURN[f.id].fx[t];});
  TK.forEach(t=>out[t]=Math.min(out[t],4));return out;
}
function furnFactor(room,t){
  if(!S.furn)return 1;
  const r=zoneScore('oda'+room)[t]||0,l=zoneScore('lobi')[t]||0;
  return Math.max(.55,1-.1*(r+.5*l));
}

function showBuild(){
  if(!S.furn)defaultFurn();
  B={hold:null,sel:null,ghost:null};
  openModal('<h2>Kat planı</h2><p>Kasada <b id="pl-lira">'+S.lira+' ₺</b> var. Listeden bir eşya seç ve plana yerleştir. Yerleştirdiğin bir eşyaya dokunarak onu taşıyabilir, döndürebilir ya da satabilirsin. Odadaki eşyalar o odada kalan konuğa, lobidekiler herkese yarım etkiyle iyi gelir.</p>'+
   '<div class="plan-wrap"><div style="display:flex;flex-direction:column;gap:8px;min-width:0"><div class="plan" id="plan"></div><div class="plan-bar" id="plan-bar"></div><div class="rooms-sum" id="rooms-sum"></div></div>'+
   '<div class="cat-list" id="cat-list"></div></div>'+
   '<button class="btn primary" type="button" id="b-build-close">Planı kaydet ve kapat</button>');
  $('sheet').classList.add('wide');
  renderCatalog();renderPlan();
  const plan=$('plan');
  const cellOf=e=>{const r=plan.getBoundingClientRect();return [Math.floor((e.clientX-r.left)/r.width*PW),Math.floor((e.clientY-r.top)/r.height*PH)];};
  const anchor=(c)=>{const d=FURN[B.hold.id],[w,h]=B.hold.rot?[d.h,d.w]:[d.w,d.h];return [c[0]-Math.floor((w-1)/2),c[1]-Math.floor((h-1)/2)];};
  plan.addEventListener('pointermove',e=>{if(!B.hold||e.pointerType!=='mouse')return;B.ghost=anchor(cellOf(e));renderGhost();});
  plan.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&B.hold){B.ghost=null;renderGhost();}});
  plan.addEventListener('click',e=>{
    const c=cellOf(e);
    if(B.hold){
      const a=anchor(c);
      const same=B.ghost&&B.ghost[0]===a[0]&&B.ghost[1]===a[1];
      if(e.pointerType&&e.pointerType!=='mouse'&&!same){B.ghost=a;renderGhost();return;}
      B.ghost=a;tryDrop();return;
    }
    const it=e.target.closest('.fi');
    B.sel=it&&!it.classList.contains('fixed')?+it.dataset.uid:null;renderPlan();
  });
  $('cat-list').addEventListener('click',e=>{
    const b=e.target.closest('.ci');if(!b||b.disabled)return;
    if(B.hold&&B.hold.from)S.furn.push(B.hold.from);
    B.hold={id:b.dataset.id,rot:0,from:null};B.sel=null;B.ghost=null;renderCatalog();renderPlan();
  });
  $('plan-bar').addEventListener('click',e=>{
    const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
    if(act==='rot'&&B.hold){B.hold.rot=B.hold.rot?0:1;renderGhost();return;}
    if(act==='cancel'){if(B.hold&&B.hold.from)S.furn.push(B.hold.from);B.hold=null;B.ghost=null;renderCatalog();renderPlan();return;}
    const f=S.furn.find(x=>x.uid===B.sel);if(!f)return;
    if(act==='move'){S.furn=S.furn.filter(x=>x!==f);B.hold={id:f.id,rot:f.rot,from:f};B.ghost=[f.x,f.y];B.sel=null;renderPlan();}
    if(act==='frot'){const nr=f.rot?0:1;if(canPlace(f.id,f.x,f.y,nr,f.uid)){f.rot=nr;save();renderPlan();}else flashBar('Burada döndürmeye yer yok.');}
    if(act==='sell'){const v=Math.floor(FURN[f.id].cost/2);S.furn=S.furn.filter(x=>x!==f);S.lira+=v;B.sel=null;addLog(FURN[f.id].name+' '+v+' ₺ karşılığında satıldı.');save();renderCatalog();renderPlan();renderStats();}
  });
  document.addEventListener('keydown',buildKeys);
  $('b-build-close').onclick=()=>{if(B.hold&&B.hold.from)S.furn.push(B.hold.from);B.hold=null;document.removeEventListener('keydown',buildKeys);$('sheet').classList.remove('wide');save();closeModal();renderAll();};
}
function buildKeys(e){if($('modal').hidden||!B.hold)return;if(e.key==='r'||e.key==='R'){B.hold.rot=B.hold.rot?0:1;renderGhost();}if(e.key==='Escape'){if(B.hold.from)S.furn.push(B.hold.from);B.hold=null;B.ghost=null;renderCatalog();renderPlan();}}

function tryDrop(){
  const h=B.hold,[x,y]=B.ghost;
  if(!canPlace(h.id,x,y,h.rot)){flashBar(FURN[h.id].zone==='lobi'?'Bu eşya yalnızca lobiye konabilir.':FURN[h.id].zone==='oda'?'Bu eşya yalnızca açık bir odaya konabilir.':'Buraya sığmıyor.');renderGhost();return;}
  if(h.from){h.from.x=x;h.from.y=y;h.from.rot=h.rot;S.furn.push(h.from);B.sel=h.from.uid;B.hold=null;}
  else{
    const cost=FURN[h.id].cost;if(S.lira<cost){flashBar('Kasada yeterli para yok.');return;}
    S.lira-=cost;const f={uid:S.fid++,id:h.id,x,y,rot:h.rot};S.furn.push(f);addLog(FURN[h.id].name+' yerleştirildi.');Sound.chime();

    return '<div><b>'+z.name+(g?' · '+g.name:z.room?' · boş':' · herkes')+'</b>'+TK.map(t=>sc[t]?'<span style="color:var(--t-'+t+')" title="'+TYPES[t].need+'">'+TYPES[t].need+' +'+sc[t]+'</span>':'').filter(Boolean).join(' · ')+(TK.every(t=>!sc[t])?'<span style="color:var(--muted)">Henüz etkisi yok</span>':'')+'</div>';}).join('');
}

const Sound=(()=>{
  let ctx=null,master=null,delay=null,on=false,timer=null,next=0,step=0;
  // Orijinal, anlık üretilen lounge cazı: F majörde 8 ölçülük döngü, swing ritim
  const BPM=92,BEAT=60/BPM;
  const PROG=[
    {b:41,v:[57,60,64,67],t:[65,69,72,76,77,79,81,84]},   // Fmaj9
    {b:38,v:[54,60,64,66],t:[66,69,72,74,76,78,81]},      // D7(9)
    {b:43,v:[58,62,65,69],t:[67,70,72,74,77,79,82]},      // Gm9
    {b:36,v:[58,62,64,69],t:[67,69,70,72,74,76,79]},      // C13
    {b:45,v:[60,64,67,71],t:[69,72,74,76,79,81,84]},      // Am9
    {b:38,v:[54,60,64,71],t:[66,69,71,72,74,78,81]},      // D13
    {b:43,v:[58,62,65,69],t:[67,70,72,74,77,79,82]},      // Gm9
    {b:36,v:[58,62,64,68],t:[67,68,70,72,76,79,80]}       // C7(b13)
  ];
  let noise=null,bar=0,beat=0,phrase=false,lastMel=72;
  const hz=m=>440*Math.pow(2,(m-69)/12);
  function init(){
    if(ctx)return;
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    ctx=new AC();master=ctx.createGain();master.gain.value=0;
    const comp=ctx.createDynamicsCompressor();master.connect(comp);comp.connect(ctx.destination);
    delay=ctx.createDelay(1);delay.delayTime.value=BEAT*.75;const fb=ctx.createGain();fb.gain.value=.22;const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;
    const wet=ctx.createGain();wet.gain.value=.5;
    delay.connect(lp);lp.connect(fb);fb.connect(delay);lp.connect(wet);wet.connect(master);
    noise=ctx.createBuffer(1,ctx.sampleRate*.5,ctx.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  function env(g,t,a,peak,dec){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+dec);}
  function tone(m,t,dur,type,vol,toDelay){
    const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=hz(m);
    env(g,t,.01,vol,dur);o.connect(g);g.connect(master);if(toDelay)g.connect(delay);o.start(t);o.stop(t+dur+.05);
  }
  // elektrik piyano: temel ton + kısa "tine" parlaması
  function rhodes(m,t,dur,vol){
    const o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain(),g2=ctx.createGain(),f=ctx.createBiquadFilter();
    o.type='sine';o.frequency.value=hz(m);o2.type='sine';o2.frequency.value=hz(m)*4.0;f.type='lowpass';f.frequency.value=2600;
    env(g,t,.008,vol,dur);env(g2,t,.003,vol*.35,.18);
    o.connect(g);o2.connect(g2);g2.connect(g);g.connect(f);f.connect(master);f.connect(delay);
    o.start(t);o2.start(t);o.stop(t+dur+.05);o2.stop(t+.3);
  }
  // vibrafon: yumuşak tremololu melodi
  function vibe(m,t,dur,vol){
    const o=ctx.createOscillator(),g=ctx.createGain(),tr=ctx.createGain(),lfo=ctx.createOscillator(),lg=ctx.createGain();
    o.type='sine';o.frequency.value=hz(m);lfo.frequency.value=5.2;lg.gain.value=.35;tr.gain.value=.65;
    lfo.connect(lg);lg.connect(tr.gain);env(g,t,.006,vol,dur);
    o.connect(tr);tr.connect(g);g.connect(master);g.connect(delay);o.start(t);lfo.start(t);o.stop(t+dur+.05);lfo.stop(t+dur+.05);
  }
  // kontrbas: yuvarlak, kısa sönümlü
  function bass(m,t){
    const o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();
    o.type='triangle';o.frequency.value=hz(m);o2.type='sine';o2.frequency.value=hz(m);f.type='lowpass';f.frequency.setValueAtTime(900,t);f.frequency.exponentialRampToValueAtTime(260,t+.3);
    env(g,t,.012,.32,BEAT*.95);o.connect(f);o2.connect(f);f.connect(g);g.connect(master);o.start(t);o2.start(t);o.stop(t+BEAT+.1);o2.stop(t+BEAT+.1);
  }
  // fırça baterisi: ride ve hi-hat gürültüden
  function hit(t,freq,vol,dec){
    const n=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();n.buffer=noise;f.type='highpass';f.frequency.value=freq;
    env(g,t,.002,vol,dec);n.connect(f);f.connect(g);g.connect(master);n.start(t,Math.random()*.3);n.stop(t+dec+.05);
  }
  function brush(t){
    const n=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();n.buffer=noise;f.type='bandpass';f.frequency.value=3000;f.Q.value=.7;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.025,t+BEAT*.5);g.gain.linearRampToValueAtTime(0,t+BEAT);n.connect(f);f.connect(g);g.connect(master);n.start(t);n.stop(t+BEAT+.05);
  }
  function walk(i){
    const ch=PROG[bar],nx=PROG[(bar+1)%PROG.length],r=ch.b;
    if(i===0)return r;
    if(i===1){const minor=ch.v.some(m=>(m-r+120)%12===3);return r+(minor?3:4)+(Math.random()<.3?12:0);}
    if(i===2)return r+7;
    return nx.b+(Math.random()<.5?1:-1);
  }
  function melody(t,ch,len){
    const opts=ch.t;let best=opts[0],bd=99;
    const target=lastMel+(Math.random()<.5?-1:1)*(1+Math.floor(Math.random()*4));
    opts.forEach(m=>{const d=Math.abs(m-target);if(d<bd){bd=d;best=m;}});
    lastMel=best;vibe(best,t,len,.07);
  }
  function tick(){
    while(next<ctx.currentTime+.5){
      const ch=PROG[bar],t=next,sw=BEAT*2/3;
      // bas: her vuruşta yürüyen bas
      bass(walk(beat),t);
      // bateri: ride "ding ding-da ding ding-da", hi-hat 2 ve 4'te, fırça sürekli
      hit(t,7000,beat%2?.05:.035,.22);
      if(beat%2===1){hit(t+sw,7000,.025,.12);hit(t,9000,.03,.04);}
      brush(t);
      // piyano: Charleston ritmi ve rastgele vurgular
      if(beat===0&&Math.random()<.7)ch.v.forEach(m=>rhodes(m,t,BEAT*1.2,.045));
      if(beat===1&&Math.random()<.6)ch.v.forEach(m=>rhodes(m,t+sw,BEAT*.9,.04));
      if(beat===2&&Math.random()<.35)ch.v.forEach(m=>rhodes(m,t,BEAT*.8,.04));
      if(beat===3&&Math.random()<.45)ch.v.forEach(m=>rhodes(m,t+sw,BEAT*1.4,.04));
      // vibrafon: ölçü başında cümleye başla ya da sus
      if(beat===0)phrase=Math.random()<.6;
      if(phrase){
        if(Math.random()<.7)melody(t,ch,BEAT*.9);
        if(Math.random()<.45)melody(t+sw,ch,BEAT*.5);
      }
      next+=BEAT;beat++;
      if(beat===4){beat=0;bar=(bar+1)%PROG.length;}
    }
  }
  function start(){
    init();if(!ctx)return false;ctx.resume();
    master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setTargetAtTime(.5,ctx.currentTime,.8);
    next=ctx.currentTime+.1;bar=0;beat=0;clearInterval(timer);timer=setInterval(tick,100);return true;
  }
  function stop(){if(!ctx)return;master.gain.setTargetAtTime(0,ctx.currentTime,.3);clearInterval(timer);timer=null;}
  function ui(){const b=$('b-sound');b.textContent='Müzik: '+(on?'açık':'kapalı');b.setAttribute('aria-pressed',String(on));}
  return {
    isOn(){return on;},
    toggle(){if(!on&&radioOn)$('b-radio').click();on=!on;if(on){if(!start())on=false;}else stop();ui();try{localStorage.setItem('konuk-sound',on?'1':'0');}catch(e){}},
    wantsOn(){try{return localStorage.getItem('konuk-sound')==='1';}catch(e){return false;}},
    pluck(combo,types){if(!on||!ctx)return;const t=ctx.currentTime;types.forEach((ty,i)=>{const m=[77,79,81,84,86][TK.indexOf(ty)]+Math.min(combo,4)*2;tone(m,t+i*.06,.35,'sine',.09,true);});},
    meow(){if(!on||!ctx)return;const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();o.type='sawtooth';f.type='bandpass';f.frequency.value=1400;f.Q.value=3;o.frequency.setValueAtTime(620,t);o.frequency.linearRampToValueAtTime(900,t+.12);o.frequency.linearRampToValueAtTime(560,t+.42);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12,t+.05);g.gain.exponentialRampToValueAtTime(.001,t+.45);o.connect(f);f.connect(g);g.connect(master);o.start(t);o.stop(t+.5);},
    chime(){if(!on||!ctx)return;const t=ctx.currentTime;[77,81,84].forEach((m,i)=>tone(m,t+i*.09,.6,'sine',.08,true));},
    ui
  };
})();

function lastV(w){if(w==='Kemal')return 'e';const m=w.toLowerCase().match(/[aeıioöuü](?=[^aeıioöuü]*$)/);return m?m[0]:'e';}
const endsV=w=>/[aeıioöuü]$/i.test(w);
function gen(w){const v=lastV(w),x={a:'ın',ı:'ın',e:'in',i:'in',o:'un',u:'un',ö:'ün',ü:'ün'}[v];return w+'’'+(endsV(w)?'n':'')+x;}
function dat(w){const v=lastV(w),x='aıou'.includes(v)?'a':'e';return w+'’'+(endsV(w)?'y':'')+x;}
function acc(w){const v=lastV(w),x={a:'ı',ı:'ı',e:'i',i:'i',o:'u',u:'u',ö:'ü',ü:'ü'}[v];return w+'’'+(endsV(w)?'y':'')+x;}
const POS=['{a} ile {b} avluda tavla oynadı.','{a}, {b:dat} memleketinden hikâyeler anlattı.','{a} ile {b} gün batımında sahile yürüdü.','{a} ile {b} aynı şarkıyı mırıldandı.'];
const NEG=['{a}, {b:gen} gece yarısı gürültüsünden şikâyet etti.','{a} ile {b} son börek için tartıştı.','{a}, {b:gen} dağınıklığına söylendi.'];

function night(){
  if(document.getElementById('modal').hidden===false)return;
  const rep0=rep();
  const lines={pay:0,social:[],out:[],inn:[],sleep:[]};
  S.guests.forEach(g=>{const p=8+Math.floor(g.gonul/10)*2;lines.pay+=p;});
  S.lira+=lines.pay;
  for(let i=0;i<S.guests.length;i++)for(let j=i+1;j<S.guests.length;j++){
    const a=S.guests[i],b=S.guests[j],k=relKey(a,b);
    const ck=[a.trait,b.trait].sort().join('|'),comp=COMPAT[ck]||0;
    const before=S.rel[k]||0,delta=comp*22+ri(-12,12);
    S.rel[k]=clamp(before+delta,-100,100);
    const tpl=delta>=0?rnd(POS):rnd(NEG),pair=Math.random()<.5?[a,b]:[b,a];
    let s=tpl.replace('{a}',pair[0].name).replace('{b:dat}',dat(pair[1].name)).replace('{b:gen}',gen(pair[1].name)).replace('{b}',pair[1].name);
    if(before<30&&S.rel[k]>=30)s+=' Artık arkadaşlar.';
    if(before>-30&&S.rel[k]<=-30)s+=' Aralarında soğuk rüzgârlar esiyor.';
    lines.social.push(s);addLog(s);
  }
  CATS.forEach(cat=>{
    if(!S.guests.length||Math.random()>.55)return;
    const g=rnd(S.guests);let s;
    if(g.trait==='titiz'){g.gonul=clamp(g.gonul-3,0,100);s=cat.name+' gece '+gen(g.name)+' yatağına kıvrıldı. '+g.name+' sabah tüy temizlemekten şikâyetçi.';}
    else{g.gonul=clamp(g.gonul+5,0,100);s=cat.name+' gece '+gen(g.name)+' ayak ucunda mırlayarak uyudu. '+g.name+' çok mutlu.';}
    lines.social.push(s);addLog(s);
  });
  S.guests.forEach(g=>{
    g.needs.yastik=clamp(g.needs.yastik+40,0,100);g.needs.yemek=clamp(g.needs.yemek-12,0,100);g.needs.sabun=clamp(g.needs.sabun-6,0,100);
    g.nights--;
  });
  const leaving=S.guests.filter(g=>g.nights<=0);
  leaving.forEach(g=>{
    const st=g.gonul>=80?5:g.gonul>=60?4:g.gonul>=40?3:g.gonul>=20?2:1;
    let text=rnd(QUOTES[st]);if(st>=4)text+=' '+FAV_LINE[TRAITS[g.trait].fav];
    const tip=st>=4?st*6:0;S.lira+=tip;
    const rv={name:g.name,trait:g.trait,origin:g.origin,stars:st,day:S.day,text,tip};
    S.reviews.push(rv);lines.out.push(rv);
    addLog(g.name+' ayrıldı ve '+st+' yıldız verdi.');
  });
  S.guests=S.guests.filter(g=>g.nights>0);
  const r=rep()||3;
  for(let i=S.guests.length;i<S.rooms;i++){
    const chance=S.guests.length===0?1:.35+r*.1;
    if(Math.random()<chance){const g=newGuest();S.guests.push(g);lines.inn.push(g);addLog(g.name+' kapıyı çaldı. '+g.origin+', '+TRAITS[g.trait].label.toLowerCase()+' biri.');}
  }
  if(S.decor.ayna)S.guests.forEach(g=>g.gonul=clamp(g.gonul+5,0,100));
  S.guests.forEach(g=>g.wish=makeWish(g));
  S.sel=0;
  let winNow=false;
  if(!S.won&&S.reviews.length>=8&&rep()>=4.5){S.won=true;winNow=true;}
  S.pendingNight={lines,winNow,day:S.day};
  bus('day',{...stats(),pay:lines.pay,reviews:lines.out.map(r=>r.stars)});S.todayTiles=0;
  save();
  showNight();
}
function showNight(){
  const {lines,winNow,day}=S.pendingNight;
  const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);
  let h='<h2>'+day+'. günün sonu</h2>';
  if(winNow)h+='<div class="win">Simge Hotel beş yıldızlı oldu! Son yorumların ortalaması '+rep().toFixed(1)+'. İstersen oynamaya devam edebilirsin.</div>';
  h+='<p>Konuklar oda parası olarak <b>'+lines.pay+' ₺</b> ödedi. Kasada <b>'+S.lira+' ₺</b> var.</p>';
  if(lines.social.length)h+='<h3>Akşam avluda</h3><ul>'+lines.social.map(s=>'<li>'+s+'</li>').join('')+'</ul>';
  if(lines.out.length)h+='<h3>Ayrılanların yorumları</h3>'+lines.out.map(rv=>'<div class="review"><div><b>'+rv.name+'</b> <span class="stars">'+stars(rv.stars)+'</span>'+(rv.tip?' <small>· '+rv.tip+' ₺ bahşiş</small>':'')+'</div><div>“'+rv.text+'”</div></div>').join('');
  if(lines.inn.length)h+='<h3>Yeni gelenler</h3><ul>'+lines.inn.map(g=>'<li><b>'+g.name+'</b>, '+g.origin+'. '+TRAITS[g.trait].label+': '+TRAITS[g.trait].desc+'.</li>').join('')+'</ul>';
  else if(!S.guests.length)h+='<p>Bu gece kimse gelmedi.</p>';
  h+='<h3>Oteli geliştir</h3><div class="shop">'+SHOP.map(it=>{
    const own=S.up[it.id];
    return '<div class="item'+(own?' owned':'')+'"><b>'+it.name+'</b><p>'+it.desc+'</p>'+(own?'<p>Alındı</p>':'<button class="btn" type="button" data-buy="'+it.id+'"'+(S.lira<it.cost?' disabled':'')+'>'+it.cost+' ₺ öde</button>')+'</div>';
  }).join('')+'</div>';
  h+='<button class="btn" type="button" id="b-decor2">Oteli dekore et</button>';
  h+='<button class="btn primary" type="button" id="b-morning">Sabah oldu, '+(day+1)+'. güne başla</button>';
  openModal(h);
  $('sheet').querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{
    const it=SHOP.find(x=>x.id===b.dataset.buy);if(S.lira<it.cost)return;
    S.lira-=it.cost;S.up[it.id]=true;if(it.id==='oda')S.rooms=4;
    addLog(it.name+' alındı.');save();showNight();renderStats();
  });
  $('b-decor2').onclick=showDecor;
  $('b-morning').onclick=()=>{
    S.day++;S.move=0;S.pendingNight=null;S.petted={};
    if(S.rooms>S.guests.length&&S.up.oda&&!S.guests.length){}
    addLog(S.day+'. gün başladı.');closeModal();renderAll();save();
  };
}

function floatAt(gid,text,color){
  const card=document.querySelector('.guest[data-id="'+gid+'"]');if(!card)return;
  const r=card.getBoundingClientRect();if(!r.width)return;
  const f=document.createElement('div');f.className='float';f.textContent=text;f.style.color=color;

  f.style.left=(r.left+r.width-150+(n%3)*10)+'px';f.style.top=(r.top+14+(n%4)*16)+'px';
  document.body.appendChild(f);setTimeout(()=>f.remove(),1150);
}

const board=$('board');
board.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.tile');if(!el||busy)return;
  drag={x:e.clientX,y:e.clientY,r:+el.dataset.r,c:+el.dataset.c,moved:false};
  try{board.setPointerCapture(e.pointerId);}catch(_){}
});
board.addEventListener('pointermove',e=>{
  if(!drag||drag.moved)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;
  drag.moved=true;
  const t=Math.abs(dx)>Math.abs(dy)?[drag.r,drag.c+Math.sign(dx)]:[drag.r+Math.sign(dy),drag.c];
  if(t[0]>=0&&t[0]<N&&t[1]>=0&&t[1]<N)trySwap([drag.r,drag.c],t);
});
board.addEventListener('pointerup',()=>{
  if(!drag)return;const d=drag;drag=null;if(d.moved||busy)return;
  const p=[d.r,d.c];
  if(selTile&&Math.abs(selTile[0]-p[0])+Math.abs(selTile[1]-p[1])===1){trySwap(selTile,p);return;}
  selTile=(selTile&&selTile[0]===p[0]&&selTile[1]===p[1])?null:p;renderBoard();
});
board.addEventListener('pointercancel',()=>{drag=null;});

function renderRoomList(){
  const el=$('room-list');if(!el)return;
  el.innerHTML=CHAT_ROOMS.map(r=>{const c=peersIn(r.id).length;return '<button type="button" class="room-btn'+(Chat.cur===r.id?' on':'')+'" data-room="'+r.id+'"><b>'+r.name+'</b><small>'+(c?c+' kişi içeride':'Şu an boş')+'</small></button>';}).join('');
}
function joinChat(id){
  if(Chat.unsub){Chat.unsub();Chat.unsub=null;}
  Chat.cur=id;Chat.msgs=[];Chat.open=true;
  Chat.room.presence({nick:Chat.nick,room:id,st:KonukGame.stats()}).catch(()=>{});
  const q=Chat.db.collection('chat/'+id+'/msgs').orderBy('ts','desc').limit(60);
  Chat.status='Mesajlar yükleniyor…';
  const t=setTimeout(()=>{if(Chat.status)Chat.status='Mesajlar yüklenemedi. Yine de yazabilirsin.';renderChatPanel();},10000);
  Chat.unsub=q.onSnapshot(snap=>{clearTimeout(t);Chat.status=null;Chat.msgs=snap.docs.map(d=>d.data()).reverse();renderChatPanel(true);},err=>{clearTimeout(t);Chat.status='Mesajlar okunamadı.';renderChatPanel();});
  renderChatPanel(true);
  chatPost('sys',Chat.nick+' odaya girdi.');
}
function leaveChat(){
  if(Chat.cur)chatPost('sys',Chat.nick+' odadan ayrıldı.');
  if(Chat.unsub){Chat.unsub();Chat.unsub=null;}
  Chat.cur=null;Chat.room&&Chat.room.presence({room:null}).catch(()=>{});
  $('chat-panel')?.remove();
}
async function chatPost(type,text){
  if(!Chat.cur||!Chat.db)return false;
  try{await Chat.db.collection('chat/'+Chat.cur+'/msgs').add({type,nick:Chat.nick,text:String(text).slice(0,300),ts:Date.now()});return true;}
  catch(e){if(type==='msg'){Chat.status=/permission|not_granted|denied|forbidden/i.test((e&&(e.code||''))+' '+(e&&e.message||''))?'Bu odaya yazma iznin yok. Oyunu paylaşan kişiden seni “Katkıda bulunan” yapmasını iste.':'Mesaj gönderilemedi, birazdan tekrar dene.';renderChatPanel();}return false;}
}
function renderChatPanel(scroll){
  if(!Chat.cur)return;
  let p=$('chat-panel');
  if(!p){
    p=document.createElement('section');p.id='chat-panel';p.className='chat-panel';p.setAttribute('aria-label','Sohbet odası');
    p.innerHTML='<header class="cp-head"><button type="button" class="cp-title" id="cp-toggle"></button><button type="button" class="btn" id="cp-rooms">Oda değiştir</button><button type="button" class="btn" id="cp-leave">Çık</button></header>'+
      '<div class="cp-body"><div class="cp-people" id="cp-people"></div><ol class="cp-msgs" id="cp-msgs"></ol><p class="cp-status" id="cp-status" hidden></p>'+
      '<form class="cp-form" id="cp-form"><input id="cp-in" maxlength="300" autocomplete="off" placeholder="Bir mesaj yaz" aria-label="Mesaj"><button class="btn primary" type="submit">Gönder</button></form></div>';
    document.body.appendChild(p);
    $('cp-toggle').onclick=()=>{Chat.open=!Chat.open;renderChatPanel(true);};
    $('cp-rooms').onclick=()=>openChat();
    $('cp-leave').onclick=leaveChat;
    $('cp-form').addEventListener('submit',async e=>{
      e.preventDefault();const inp=$('cp-in'),v=inp.value.trim();if(!v)return;
      if(Date.now()-Chat.lastSend<800)return;Chat.lastSend=Date.now();
      inp.value='';Chat.status=null;if(!(await chatPost('msg',v)))inp.value=v;
    });
  }
  p.classList.toggle('closed',!Chat.open);
  const people=peersIn(Chat.cur);
  const total=people.reduce((a,x)=>a+((x.presence.st&&+x.presence.st.tiles)||0),0);
  $('cp-toggle').textContent=roomName(Chat.cur)+' · '+people.length+' kişi · oda skoru '+total+(Chat.open?' ▾':' ▴');
  const pe=$('cp-people');pe.innerHTML='';
  people.slice().sort((a,b)=>((b.presence.st||{}).tiles||0)-((a.presence.st||{}).tiles||0)).forEach(x=>{
    const st=x.presence.st||{},d=document.createElement('span');d.className='cp-person'+(x.isMe?' me':'');
    d.textContent=cleanNick(x.presence.nick)||'Misafir';
    const sm=document.createElement('small');sm.textContent=(x.isMe?' (sen)':'')+' · '+(st.tiles||0)+' taş · Gün '+(st.day||1)+(st.rep?' · '+st.rep+'★':'');
    d.appendChild(sm);pe.appendChild(d);
  });
  const ol=$('cp-msgs');ol.innerHTML='';
  if(!Chat.msgs.length){const li=document.createElement('li');li.className='sys';li.textContent='Henüz mesaj yok. İlk merhabayı sen de.';ol.appendChild(li);}
  Chat.msgs.forEach(m=>{
    const li=document.createElement('li');li.className=m.type==='sys'?'sys':'';
    const tm=new Date(+m.ts||0);const hh=String(tm.getHours()).padStart(2,'0')+':'+String(tm.getMinutes()).padStart(2,'0');
    const sm=document.createElement('small');sm.textContent=hh;li.appendChild(sm);
    if(m.type!=='sys'){const b=document.createElement('b');b.textContent=(cleanNick(m.nick)||'Misafir')+': ';li.appendChild(b);}
    li.appendChild(document.createTextNode(String(m.text||'').slice(0,300)));ol.appendChild(li);
  });
  if(scroll)ol.scrollTop=ol.scrollHeight;
  const stt=$('cp-status');stt.hidden=!Chat.status;stt.textContent=Chat.status||'';
}
let statT=0;
window.addEventListener('konuk:move',()=>{if(!Chat.cur||Date.now()-statT<1500)return;statT=Date.now();Chat.room.presence({st:KonukGame.stats()}).catch(()=>{});});
window.addEventListener('konuk:match',e=>{if(Chat.cur&&e.detail.len>=5)chatPost('sys',Chat.nick+' 5’li eşleşme yaptı!');});
window.addEventListener('konuk:day',e=>{if(!Chat.cur)return;const d=e.detail;Chat.room.presence({st:KonukGame.stats()}).catch(()=>{});chatPost('sys',Chat.nick+' '+d.day+'. günü '+d.tiles+' taşla bitirdi'+(d.reviews.length?', '+d.reviews.length+' yorum aldı ('+d.reviews.map(n=>n+'★').join(' ')+')':'')+'.');});
$('b-chat').onclick=()=>{if(!busy)openChat();};
window.__konuk={get S(){return S;},findMove,trySwap,night};
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
